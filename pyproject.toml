[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azos"
version = "0.3.0"
description = "AZ-OS: ethics-gated shell. Commands run in a session folder on this machine. Integrity precedes execution."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "az-os",
    "remote-shell",
    "ethics",
    "overlay",
    "authorization",
    "integrity",
    "gates",
    "append-only",
    "invite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
azos = "azos.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/azos"
Download = "https://azos-download-tracker.vibelock.workers.dev/"
Issues = "https://github.com/AzielEliab/azos/issues"

[tool.setuptools.packages.find]
include = ["azos*"]

[tool.setuptools.package-data]
azos = ["templates/*.html", "templates/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
