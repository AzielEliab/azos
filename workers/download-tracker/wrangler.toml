name = "azos-download-tracker"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

[[kv_namespaces]]
binding = "DOWNLOADS"
id = "816b8d5da5fd470f9c4e783f3c87ca77"

[assets]
directory = "./public"
binding = "ASSETS"
# /v1/* covers local /v1/{op} and /v1/mesh/* (AZIEL_RUNTIME proxy).
run_worker_first = ["/", "/download", "/download/*", "/stats", "/event", "/go", "/count", "/install.sh", "/sigil.png", "/sigil.png/", "/sigil.svg", "/sigil.svg/", "/brand/sigil.svg", "/v1", "/v1/*", "/openapi.json", "/ai", "/ai/*", "/mcp", "/mcp/", "/robots.txt", "/robots.txt/", "/sitemap.xml", "/sitemap.xml/", "/cite.json", "/cite.json/", "/llms.txt", "/llms.txt/", "/ai.txt", "/ai.txt/"]

[vars]
AZIEL_RUNTIME_ORIGIN = "https://aziel-runtime.vibelock.workers.dev"

[[services]]
binding = "AZIEL_RUNTIME"
service = "aziel-runtime"
